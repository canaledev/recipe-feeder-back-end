apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: feedy-postgres
spec:
  serviceName: feedy-postgres
  replicas: 1
  selector:
    matchLabels:
      app: feedy-postgres
  template:
    metadata:
      labels:
        app: feedy-postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: feedy-db-secret
              key: postgres-password
        - name: POSTGRES_DB
          value: feedy_prod
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U postgres
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: feedy-postgres
spec:
  clusterIP: None
  selector:
    app: feedy-postgres
  ports:
  - port: 5432
    targetPort: 5432
